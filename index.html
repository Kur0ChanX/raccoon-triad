<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="build" content="t3">
<meta name="theme-color" content="#0a0820">
<title>Raccoon Triad</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#0a0820;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  #land{min-height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
  #land img{width:96px;height:96px;border-radius:24px}
  #land h1{margin:12px 0 4px;font-size:1.8rem}
  #land p{opacity:.7;margin:0 0 20px}
  #land button{font:800 1.05rem system-ui;padding:14px 28px;border:0;border-radius:16px;color:#20143a;background:linear-gradient(180deg,#ffe27a,#ffb42e);cursor:pointer}
  #land a{display:block;margin-top:18px;color:#b9a8ff;font-size:.9rem}
</style>
</head>
<body>
<div id="land"><div>
  <img src="icons/icon-192.png" alt="">
  <h1>Raccoon Triad</h1>
  <p>Il gioco di carte con i personaggi dei videogiochi più famosi</p>
  <button id="play">Gioca</button>
  <a href="https://kur0chanx.github.io/TierListGame/">← Torna alla Tier List</a>
</div></div>
<script src="shell.js"></script>
<script src="qrcode.min.js" defer></script>
<script src="triad.js"></script>
<script>
  (function(){
    const open = ()=>{ try{ window.openTriad(); }catch(e){} };
    document.getElementById('play').addEventListener('click', open);
    window.addEventListener('load', ()=> setTimeout(open, 50));
  })();
</script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
</body>
</html>
